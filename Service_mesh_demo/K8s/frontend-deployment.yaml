apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: service-mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: curlimages/curl
        command:
        - sleep
        - "3600"