apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-deployment
  namespace: todo-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
      - name: todo-container
        image: todo-app
        imagePullPolicy: Never
        ports:
        - containerPort: 80
