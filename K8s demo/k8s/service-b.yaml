apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-b
  template:
    metadata:
      labels:
        app: service-b
    spec:
      containers:
      - name: service-b
        image: k8s-demo/service-b:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
        env:
        - name: SERVICE_A_URL
          # No hardcoded IP! K8s DNS resolves "service-a" to the right pod automatically
          value: "http://service-a:8001"
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector:
    app: service-b
  type: NodePort          # Expose to outside the cluster (for testing)
  ports:
  - port: 8002
    targetPort: 8002
    nodePort: 30002
